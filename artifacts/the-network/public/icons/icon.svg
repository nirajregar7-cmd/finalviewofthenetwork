<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a2e"/>
      <stop offset="45%" style="stop-color:#1e1b5e"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.55)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </radialGradient>
    <!-- Use userSpaceOnUse so vertical lines get the full gradient range -->
    <linearGradient id="strokeGrad" x1="168" y1="155" x2="344" y2="358" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#e0d7ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    <filter id="nodeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#7c3aed" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="114" ry="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" ry="114" fill="url(#glow)"/>

  <!-- Top-right ambient node cluster -->
  <circle cx="398" cy="92" r="24" fill="rgba(139,92,246,0.15)" filter="url(#softBlur)"/>
  <circle cx="432" cy="138" r="16" fill="rgba(167,139,250,0.12)" filter="url(#softBlur)"/>
  <circle cx="366" cy="112" r="14" fill="rgba(196,181,253,0.10)" filter="url(#softBlur)"/>
  <line x1="398" y1="92" x2="432" y2="138" stroke="rgba(167,139,250,0.20)" stroke-width="2"/>
  <line x1="398" y1="92" x2="366" y2="112" stroke="rgba(167,139,250,0.20)" stroke-width="2"/>
  <line x1="432" y1="138" x2="366" y2="112" stroke="rgba(167,139,250,0.15)" stroke-width="1.5"/>

  <!-- Bottom-left ambient node cluster -->
  <circle cx="110" cy="402" r="18" fill="rgba(139,92,246,0.12)" filter="url(#softBlur)"/>
  <circle cx="76" cy="358" r="12" fill="rgba(167,139,250,0.09)" filter="url(#softBlur)"/>
  <line x1="110" y1="402" x2="76" y2="358" stroke="rgba(167,139,250,0.16)" stroke-width="1.5"/>

  <!-- N lettermark — solid bright strokes so they always render -->
  <line x1="168" y1="155" x2="168" y2="358" stroke="#c4b5fd" stroke-width="36" stroke-linecap="round"/>
  <line x1="344" y1="155" x2="344" y2="358" stroke="#c4b5fd" stroke-width="36" stroke-linecap="round"/>
  <line x1="168" y1="155" x2="344" y2="358" stroke="#a78bfa" stroke-width="36" stroke-linecap="round"/>

  <!-- Corner node dots with glow -->
  <!-- Top-left -->
  <circle cx="168" cy="155" r="26" fill="#7c3aed" opacity="0.5" filter="url(#softBlur)"/>
  <circle cx="168" cy="155" r="18" fill="url(#nodeGlow)"/>
  <circle cx="168" cy="155" r="9" fill="white"/>

  <!-- Bottom-left -->
  <circle cx="168" cy="358" r="26" fill="#7c3aed" opacity="0.5" filter="url(#softBlur)"/>
  <circle cx="168" cy="358" r="18" fill="url(#nodeGlow)"/>
  <circle cx="168" cy="358" r="9" fill="white"/>

  <!-- Top-right -->
  <circle cx="344" cy="155" r="26" fill="#7c3aed" opacity="0.5" filter="url(#softBlur)"/>
  <circle cx="344" cy="155" r="18" fill="url(#nodeGlow)"/>
  <circle cx="344" cy="155" r="9" fill="white"/>

  <!-- Bottom-right -->
  <circle cx="344" cy="358" r="26" fill="#7c3aed" opacity="0.5" filter="url(#softBlur)"/>
  <circle cx="344" cy="358" r="18" fill="url(#nodeGlow)"/>
  <circle cx="344" cy="358" r="9" fill="white"/>
</svg>
