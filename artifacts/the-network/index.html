    <!-- Mobile UX -->
    <style>
      input, select, textarea { font-size: 16px; }
      html { background: #FFFFFF; }
      body { -webkit-tap-highlight-color: transparent; margin: 0; background: #FFFFFF; }
      #root { min-height: 100dvh; }
      #app-boot-fallback {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffffff 0%, #f7f5ff 100%);
        color: #17153d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app-boot-fallback-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 28px;
        text-align: center;
      }
      #app-boot-fallback-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        font-size: 22px;
        font-weight: 800;
        box-shadow: 0 10px 24px rgba(79, 70, 229, 0.22);
      }
      #app-boot-fallback p { margin: 0; font-size: 14px; font-weight: 700; }
      #app-boot-fallback small { color: #64748b; font-size: 12px; font-weight: 500; }
      #app-boot-fallback-spinner {
        width: 20px;
        height: 20px;
        border: 3px solid #ddd9ff;
        border-top-color: #4f46e5;
        border-radius: 999px;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-fallback" role="status" aria-live="polite">
        <div id="app-boot-fallback-card">
          <div id="app-boot-fallback-mark" aria-hidden="true">N</div>
          <div id="app-boot-fallback-spinner" aria-hidden="true"></div>
          <p>Loading The Network…</p>
          <small>Restoring your student network</small>
        </div>
      </div>
    </div>
