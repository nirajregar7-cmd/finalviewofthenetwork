name: Generate daily community quizzes

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-community-quizzes
  cancel-in-progress: false

jobs:
  publish-quizzes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate and publish today's quizzes
        env:
          QUIZ_CRON_SECRET: ${{ secrets.QUIZ_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$QUIZ_CRON_SECRET" ]; then
            echo "Configure the QUIZ_CRON_SECRET repository secret before running this workflow."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 30 \
            --max-time 900 \
            --retry 5 \
            --retry-delay 30 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${QUIZ_CRON_SECRET}" \
            https://the-network-api.onrender.com/api/internal/community-quizzes/run
