name: Publish API container

on:
  push:
    branches:
      - azure-api-deploy
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "package.json"
      - "artifacts/api-server/**"
      - "artifacts/**/package.json"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/azure-api-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-api-container
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nirajregar7-cmd/finalviewofthenetwork-api:latest
            ghcr.io/nirajregar7-cmd/finalviewofthenetwork-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nirajregar7-cmd/finalviewofthenetwork
          cache-from: type=gha
          cache-to: type=gha,mode=max
